name: Verify VANTAGE
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: true
      - run: go mod download
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal tests scripts)"
      - run: go test ./...
      - run: go vet ./...
      - name: Check races on Linux
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build ./cmd/vantage
  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
      - run: go run scripts/release.go --version 1.0.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vantage-platform-builds
          path: dist/
          retention-days: 14
          if-no-files-found: error
